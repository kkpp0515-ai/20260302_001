<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d5ef23">
  <meta name="color-scheme" content="light">
  <title>ブラウザでゲームを開く | G123</title>
  <meta name="description" content="使用するブラウザを選択してゲームを開きます。">
  <style>
    :root{color-scheme:light;--ink:#192b22;--muted:#617068;--lime:#d5ef23;--border:#dbe3dc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;padding:24px 16px;background:#f1f4ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
    .card{width:100%;max-width:460px;margin:clamp(20px,6vh,64px) auto;padding:32px clamp(20px,6vw,32px) 24px;background:#fff;border:1px solid #e4eae2;border-radius:22px;box-shadow:0 8px 32px rgb(25 43 34 / 4%);text-align:center}
    .brand{display:inline-block;margin:0 0 22px;padding:0 2px 3px;border-bottom:5px solid var(--lime);font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:900;font-style:italic;letter-spacing:-2px;line-height:1}
    h1{margin:0;font-size:22px;font-weight:750;line-height:1.5;letter-spacing:.01em}
    .lead{margin:16px 0 26px;color:var(--muted);font-size:15px;line-height:1.9}
    .actions{display:grid;gap:12px}
    .button{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:16px 12px;border:1px solid transparent;border-radius:12px;font:inherit;font-size:16px;font-weight:700;line-height:1.5;text-align:center;text-decoration:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .primary{background:var(--lime);color:var(--ink)}
    .secondary{background:#fff;border-color:#bccabe;color:#344c3e}
    .button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
    .primary:active{background:#c6df16}
    .secondary:active{background:#f1f4ef}
    @media (hover:hover){.primary:hover{background:#cce51c}.secondary:hover{background:#f7f9f5}}
    .status{min-height:22px;margin:14px 0 0;color:#526459;font-size:13px;line-height:1.7}
    .manual{margin-top:16px;text-align:left}
    .manual label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
    .manual textarea{display:block;width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#f7f9f5;color:var(--ink);font:13px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;resize:vertical}
    .manual textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    [hidden]{display:none!important}
    noscript p{font-size:13px;overflow-wrap:anywhere}
    noscript a{color:#344c3e}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <p class="brand" aria-label="G123">G123</p>
    <h1 id="page-title">ブラウザでゲームを開く</h1>
    <p class="lead">下のボタンから、使用するブラウザを<br>選択してください。</p>
    <div class="actions">
      <a class="button primary" id="browser-open" href="intent://h5.g123.jp/game/kusuriya?platform=pr&amp;utm_source=twitter&amp;utm_campaign=kusuriya_ja_organic_pr_all&amp;utm_adgroup=gameaccount&amp;lang=ja&amp;#Intent;scheme=https;package=com.brave.browser;end">ご自身でブラウザを選択する</a>
      <button class="button secondary" id="copy-url" type="button">ゲームのURLをコピー</button>
    </div>
    <p class="status" id="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="manual" id="manual-copy" hidden>
      <label for="game-url">ゲームのURL</label>
      <textarea id="game-url" rows="4" readonly spellcheck="false">https://h5.g123.jp/game/kusuriya?platform=pr&amp;utm_source=twitter&amp;utm_campaign=kusuriya_ja_organic_pr_all&amp;utm_adgroup=gameaccount&amp;lang=ja&amp;</textarea>
    </div>
    <noscript><p><a href="https://h5.g123.jp/game/kusuriya?platform=pr&amp;utm_source=twitter&amp;utm_campaign=kusuriya_ja_organic_pr_all&amp;utm_adgroup=gameaccount&amp;lang=ja&amp;">ゲームのURL</a>を長押ししてコピーできます。</p></noscript>
  </main>
  <script>
    (function () {
      var button = document.getElementById("copy-url");
      var status = document.getElementById("copy-status");
      var manual = document.getElementById("manual-copy");
      var field = document.getElementById("game-url");
      function showManualCopy() {
        manual.hidden = false;
        field.focus();
        field.select();
        try { field.setSelectionRange(0, field.value.length); } catch (_) {}
        status.textContent = "URLを長押ししてコピーしてください。";
      }
      button.addEventListener("click", function () {
        status.textContent = "";
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            Promise.resolve(navigator.clipboard.writeText(field.value)).then(function () {
              manual.hidden = true;
              status.textContent = "URLをコピーしました。";
            }, showManualCopy);
            return;
          }
        } catch (_) {}
        showManualCopy();
      });
    }());
  </script>
</body>
</html>
