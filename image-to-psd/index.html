<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>画像 → PSD変換 | CTW Marketing Ai Tool</title>
  <link rel="stylesheet" href="../theme.css"><script src="../theme-toggle.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 24px;min-height:100vh;font-family:system-ui,sans-serif}main{max-width:900px;margin:0 auto}h1{font-size:clamp(26px,4vw,42px);margin:26px 0 12px}p{line-height:1.8}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em}.muted{opacity:.75}.panel{padding:28px;margin-top:28px}.drop{display:block;border:3px dashed var(--border,#333);padding:46px 20px;text-align:center;cursor:pointer;transition:background .15s}.drop:hover,.drop.over{background:var(--hover-bg,#ddd)}.drop strong{display:block;font-size:21px;margin-bottom:10px}.drop:focus-within{outline:3px solid #567dff;outline-offset:5px}input[type=file]{max-width:100%;margin-top:20px}#result{margin-top:24px}#preview{display:block;max-width:100%;max-height:430px;object-fit:contain;margin:0 auto;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}#filename{overflow-wrap:anywhere;font-weight:700;margin-bottom:0}button{font:inherit;font-weight:800;padding:16px 26px;cursor:pointer;width:100%;margin-top:18px;border:3px solid var(--border,#222);background:#b9f36a;color:#17210a;box-shadow:4px 4px 0 var(--shadow,#222)}button:disabled{opacity:.45;cursor:wait}#status{min-height:1.8em;overflow-wrap:anywhere}#status.error{color:#cf354a}.details{display:flex;gap:12px;flex-wrap:wrap}.details span{border:1px solid currentColor;padding:5px 10px;font-size:13px}a{color:inherit}@media(max-width:600px){body{padding:20px 16px}.panel{padding:18px}.drop{padding:28px 12px}}
  </style>
</head>
<body>
<main>
  <a href="../">← ツール一覧</a>
  <p class="eyebrow">IMAGE TO PSD</p><h1>画像を、そのままPSDに。</h1>
  <p class="muted">1枚の画像を、1レイヤーのPSDとして保存します。元の縦横サイズと透明部分を維持します。</p>
  <section class="panel neo-box">
    <label class="drop" id="drop"><strong>ここに画像をドロップ</strong><span>またはファイルを選択</span><br><input id="file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="PSDに変換する画像"></label>
    <p class="muted">PNG / JPEG / WebP · 1枚ずつ変換 · 最大2,500万画素（各辺30,000px以内）</p>
    <div id="result" hidden>
      <img id="preview" alt="選択した画像のプレビュー">
      <p id="filename"></p><p id="dimensions" class="muted"></p>
      <div class="details"><span>1レイヤー</span><span>RGB / 8bit</span><span>元のサイズ</span></div>
      <button id="download" disabled>PSDをダウンロード</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <p class="muted">画像は外部へ送信されません。文字・キャラクター・背景は、1枚の画像レイヤーにまとまります。ブラウザで読み込んだ色で出力され、元画像のカラープロファイルやEXIFは引き継ぎません。</p>
</main>
<script src="psd.js?v=20261021-2"></script><script src="app.js?v=20261021-2"></script><script src="../sidebar.js?v=20261021-2"></script>
</body></html>
