<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SciMagic Video Formatter</title><style>
*{box-sizing:border-box}body{margin:0;background:#081316;color:#e8f6f6;font:15px 'Yu Gothic',sans-serif}main{max-width:1200px;margin:auto;padding:32px 24px}h1{font-size:28px}p,.note{color:#a0b8bc;line-height:1.7}.brand{color:#64eeee;letter-spacing:3px;font-size:12px}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px}.panel{background:#102226;border:1px solid #294247;border-radius:18px;padding:22px}label{display:block;margin:16px 0 8px}textarea,select{width:100%;background:#091619;border:1px solid #426065;border-radius:8px;color:white;padding:12px;font:inherit}textarea{resize:vertical}button,.download{border:0;border-radius:8px;background:#64eeee;color:#062021;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none}button:disabled{opacity:.35;cursor:default}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:#243e43;color:#e8f6f6}.tabs .active{background:#64eeee;color:#062021}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input[type=range]{width:100%;accent-color:#64eeee}input[type=file]{max-width:100%}.stage{min-height:280px;display:flex;justify-content:center;align-items:center;background:#030b0d;border-radius:12px;overflow:hidden}canvas{display:block;max-width:100%;max-height:570px;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}video{width:100%;max-height:570px;background:black}#status{min-height:36px;color:#64eeee;margin:14px 0}.note{font-size:12px}fieldset{border:0;padding:0;margin:0}output{float:right;color:#64eeee}[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:20px 14px}}
</style><main><div class="brand">SCIMAGIC / VIDEO FORMATTER</div><h1>最後のカットを整えて、動画に。</h1><p>最終フレームで文字を配置 → 3秒の演出を確認 → MP4生成</p><div class="layout"><section class="panel"><label for="file">1 / 元動画を選択</label><input id="file" type="file" accept="video/mp4,.mp4"><p class="note">PCのChrome・Edge向け。最大100MB。動画は外部へ送信せず、このPCで処理します。</p><fieldset id="settings" disabled><div id="freeFields"><label for="caption">自由入力（改行できます）</label><textarea id="caption" rows="3" maxlength="60">二度見
してるの、</textarea><label for="emphasis">大きく見せる行</label><select id="emphasis"></select></div><label for="target">ドラッグで動かすもの</label><select id="target"><option value="title">文字</option><option value="background">背景</option></select><label for="size">文字サイズ <output id="sizeValue"></output></label><input id="size" type="range" min="30" max="170" value="100"><label for="angle">文字の角度 <output id="angleValue"></output></label><input id="angle" type="range" min="-30" max="30" value="0"><label for="zoom">背景の拡大 <output id="zoomValue"></output></label><input id="zoom" type="range" min="100" max="180" value="110"><button id="reset" style="margin-top:16px" type="button">このカットの配置を戻す</button></fieldset><button id="cancel" type="button" hidden style="margin-top:16px">処理を中止</button><div id="status" role="status" aria-live="polite">動画を選んで編集を開始してください。</div></section><section class="panel"><div class="tabs"><button id="tab0" class="active" disabled>1 / 自由入力 · 1.5秒</button><button id="tab1" disabled>2 / バレてます。· 1.5秒</button></div><div class="stage"><p id="empty">最終フレームがここに表示されます。</p><canvas id="canvas" hidden></canvas></div><p class="note">文字や背景をドラッグして配置。固定カットは添付の透過PNGを使用します。プレビューと同じ配置で書き出します。</p><div class="actions"><button id="play" disabled>3秒＋SEを確認</button><button id="render" disabled>この配置で動画を生成</button></div><video id="result" controls playsinline hidden></video><div class="actions"><a id="download" class="download" download="SciMagic.mp4" hidden>MP4を保存</a></div></section></div></main><script src="./vendor/ffmpeg.js"></script><script src="./engine.js"></script><script src="./editor.js"></script></html>
