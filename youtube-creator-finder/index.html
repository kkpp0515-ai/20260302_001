<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Creator Finder | CTW Creative Workspace</title>
<link rel="stylesheet" href="../theme.css?v=forest-2">
<script src="../theme-toggle.js?v=forest-2" defer></script>
<script src="../sidebar.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 "Yu Gothic",Meiryo,sans-serif}
main{max-width:1260px;margin:auto;padding:62px 24px 36px}h1{font:clamp(25px,4vw,40px) Georgia,serif;color:var(--gold)}a{color:var(--gold)}
form,.results{background:var(--card-bg);border:1px solid var(--border);padding:22px;margin-top:24px}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}label{display:block}input,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 12px}
input,textarea{width:100%;display:block;margin:5px 0 12px}textarea{resize:vertical}button{cursor:pointer;color:var(--gold)}button:disabled{opacity:.55;cursor:default}
small,p{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--border);padding:9px;overflow-wrap:anywhere}td:last-child{max-width:280px}
@media(max-width:850px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<a href="../index.html">← ツール一覧</a>
<h1>YouTube Creator Finder</h1>
<p>キーワードでチャンネルを検索し、公開されている連絡先候補を一覧にします。</p>
<form id="finder" autocomplete="off">
<label>YouTube Data API キー<input id="key" type="password" required spellcheck="false"></label>
<small>各自のキーを入力してください。キーは保存せず、YouTube Data API へのリクエストにのみ使用します。</small>
<div class="fields">
<label>検索キーワード（1行に1件）<textarea id="keywords" required rows="3" placeholder="ゲーム実況"></textarea></label>
<label>最低登録者数<input id="minimum" type="number" min="10000" value="10000" required></label>
<label>最大出力件数<input id="limit" type="number" min="1" max="300" value="50" required></label>
</div>
<button id="search">検索する</button>
</form>
<section class="results" aria-label="検索結果">
<p id="status" role="status">検索結果はここに表示されます。</p>
<button id="download" disabled>CSVをダウンロード</button>
<div class="table-wrap"><table>
<thead><tr><th>チャンネル</th><th>登録者数</th><th>直近5本の平均再生数</th><th>公開プロフィール</th><th>メール候補</th><th>SNS候補</th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
</section>
</main>
<script>
const field = id => document.getElementById(id);
const output = [];
const socialHosts = ['x.com', 'twitter.com', 'instagram.com', 'tiktok.com', 'twitch.tv', 'facebook.com', 'threads.net', 'discord.gg', 'bsky.app', 'linktr.ee'];

function contacts(text) {
    const emails = new Set((text.match(/[\w.%+-]+@[\w.-]+\.[a-z]{2,}/gi) || []).map(email => email.toLowerCase()));
    const socials = new Set();
    for (const match of text.match(/(?:https?:\/\/|www\.)[^\s<>"「」『』、。]+/gi) || []) {
        try {
            const url = new URL(match.replace(/[)\]!?.,;]+$/, '').replace(/^www\./i, 'https://www.'));
            if (socialHosts.some(host => url.hostname === host || url.hostname.endsWith('.' + host))) {
                socials.add(url.origin + url.pathname);
            }
        } catch {
            // Ignore malformed URLs in public descriptions.
        }
    }
    return [[...emails].join(' / '), [...socials].join(' / ')];
}

function render(row) {
    const tr = field('rows').insertRow();
    const link = document.createElement('a');
    link.href = row[1];
    link.textContent = row[0];
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    tr.insertCell().append(link);
    for (const value of row.slice(2)) tr.insertCell().textContent = value;
}

field('finder').addEventListener('submit', async event => {
    event.preventDefault();
    const key = field('key').value.trim();
    const keywords = [...new Set(field('keywords').value.split(/\r?\n/).map(word => word.trim()).filter(Boolean))];
    if (!key || !keywords.length) {
        field('status').textContent = 'APIキーと検索キーワードを入力してください。';
        return;
    }
    const minimum = Number(field('minimum').value);
    const limit = Number(field('limit').value);
    let requests = 0;
    let searchRequests = 0;
    let failure = '';
    const seen = new Set();

    async function api(resource, params) {
        requests++;
        if (resource === 'search') searchRequests++;
        field('status').textContent = `取得中… ${output.length}件 / API ${requests}回（検索 ${searchRequests}回）`;
        const response = await fetch('https://www.googleapis.com/youtube/v3/' + resource + '?' + new URLSearchParams({...params, key}), {cache:'no-store', referrerPolicy:'strict-origin-when-cross-origin'});
        if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            const reason = error.error?.errors?.[0]?.reason;
            if (['quotaExceeded', 'dailyLimitExceeded'].includes(reason)) throw new Error('YouTube APIの利用上限に達しました。');
            throw new Error(`YouTube APIがエラーを返しました（HTTP ${response.status}）。キー・APIの有効化・サイト制限を確認してください。`);
        }
        return response.json();
    }

    field('search').disabled = true;
    field('download').disabled = true;
    field('rows').replaceChildren();
    output.length = 0;
    try {
        // Cycle through keywords so the first one cannot consume all search pages.
        const pending = keywords.map(q => ({q}));
        while (pending.length && output.length < limit && searchRequests < 30) {
            const query = pending.shift();
            const results = await api('search', {part:'snippet', type:'channel', maxResults:50, ...query});
            if (results.nextPageToken) pending.push({q:query.q, pageToken:results.nextPageToken});
            const ids = [...new Set(results.items.map(item => item.id.channelId))].filter(id => id && !seen.has(id));
            if (!ids.length) continue;
            ids.forEach(id => seen.add(id));
            const channels = await api('channels', {part:'snippet,statistics,contentDetails', id:ids.join(',')});
            const videosByChannel = new Map();
            const eligible = channels.items.filter(channel => !channel.statistics?.hiddenSubscriberCount && Number(channel.statistics?.subscriberCount) >= minimum).slice(0, limit - output.length);
            for (const channel of eligible) {
                const playlistId = channel.contentDetails?.relatedPlaylists?.uploads;
                const uploads = playlistId ? await api('playlistItems', {part:'contentDetails', playlistId, maxResults:5}) : {items:[]};
                videosByChannel.set(channel.id, uploads.items.map(item => item.contentDetails.videoId).filter(Boolean));
            }
            const videoIds = [...new Set([...videosByChannel.values()].flat())];
            const videos = new Map();
            for (let i = 0; i < videoIds.length; i += 50) {
                const batch = await api('videos', {part:'snippet,statistics', id:videoIds.slice(i, i + 50).join(',')});
                for (const video of batch.items) videos.set(video.id, video);
            }
            for (const channel of eligible) {
                const recent = videosByChannel.get(channel.id).map(id => videos.get(id)).filter(Boolean);
                const views = recent.map(video => Number(video.statistics?.viewCount)).filter(Number.isFinite);
                const average = views.length ? Math.round(views.reduce((sum, value) => sum + value, 0) / views.length) : '';
                const description = channel.snippet.description || '';
                const row = [channel.snippet.title, 'https://www.youtube.com/channel/' + encodeURIComponent(channel.id),
                    channel.statistics.subscriberCount, average, description,
                    ...contacts([description, ...recent.map(video => video.snippet.description)].join('\n'))];
                output.push(row);
                render(row);
            }
        }
        if (pending.length && output.length < limit) failure = '検索の上限（1回の実行につき30ページ）に達しました。';
    } catch (error) {
        failure = error instanceof TypeError ? '通信に失敗しました。接続を確認してください。' : error.message;
    } finally {
        field('status').textContent = `${failure ? failure + ' ' : ''}${output.length}件 / API ${requests}回（検索 ${searchRequests}回）`;
        field('search').disabled = false;
        field('download').disabled = !output.length;
    }
});

field('download').addEventListener('click', () => {
    const headers = ['チャンネル名', 'チャンネルURL', '登録者数', '直近5本の平均再生数', '公開プロフィール', 'メール候補', 'SNS候補'];
    const csv = [headers, ...output].map(row => row.map(value => {
        const text = String(value);
        const safe = /^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(text) ? "'" + text : text;
        return '"' + safe.replaceAll('"', '""') + '"';
    }).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\uFEFF', csv], {type:'text/csv;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'youtube-creators.csv';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
